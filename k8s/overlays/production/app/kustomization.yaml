apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firepower

resources:
  - ../../../base/app

patches:
  - target:
      kind: Deployment
      name: handler
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: handler
      spec:
        template:
          spec:
            containers:
              - name: handler
                env:
                  # Primary (production) is the only namespace that pushes
                  # Live Activity notifications to the real APNs broadcast
                  # channels. Staging's handler runs with NOTIFIERS="" so it
                  # never touches those channels. The scheduler keeps
                  # NOTIFIERS=discord (base manifest) in both namespaces.
                  - name: NOTIFIERS
                    value: "liveactivity"
  - target:
      kind: CronJob
      name: scheduler
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: scheduler
      spec:
        # Explicit and git-managed: previously this was toggled by a direct
        # `kubectl` edit against the live cluster (never committed), so the
        # running state wasn't visible in the repo and a plain `kubectl apply`
        # of the base manifest wouldn't have changed it either way. Flip this
        # value (not a live cluster edit) to pause/resume the scheduler.
        suspend: false
