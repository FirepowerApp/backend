apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../staging/app

patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app-config
      data:
        # Manual break-glass: force the runtime detector (internal/season) to
        # agree that it's offseason, so DataSource stamped on every payload
        # stays truthful ("emulator") for as long as this overlay is applied —
        # otherwise DataSource can read "live" while these URL overrides
        # silently route real traffic to the emulator (found in review).
        SEASON_OVERRIDE: "offseason"
        # Redundant with SEASON_OVERRIDE above once DataSource resolves to
        # "emulator" (EMULATOR_*_BASE_URL takes over), kept for defense in
        # depth / backward compat with pre-runtime-detection behavior.
        PLAYBYPLAY_API_BASE_URL: "http://gamedataemulator:8125"
        STATS_API_BASE_URL: "http://gamedataemulator:8124"
        SCHEDULE_API_BASE_URL: "http://gamedataemulator:8125"
        # CHI added because the emulator's first-week slate (FLA/CHI/NYR/PIT/LAK/COL)
        # does not overlap with DAL/CAR/VGK; adding CHI ensures ≥1 game/day is
        # scheduled immediately. DAL/CAR/VGK naturally appear in the richer Jul-1+
        # slate and are kept so they continue to be exercised later in the offseason.
        TEAM_FILTER: "DAL,CAR,VGK,CHI,BOS,NYI,MTL,NYR,NJD"
